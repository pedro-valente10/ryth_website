<div class="modal" id="modal-container" role="dialog" aria-modal="true" aria-hidden="true" hidden>
  <div class="modal__overlay" id="modal-overlay"></div>
  
  <div class="modal__card">
    <button type="button" class="modal__close" id="modal-close" aria-label="Fechar mensagem">&times;</button>
    
    <div class="modal__icon-wrapper">
      <!-- Ícone de aviso em estrela roxa/verde no estilo RYTH -->
      <svg class="modal__icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z" />
      </svg>
    </div>

    <h2 class="modal__title" id="modal-title">Aviso</h2>
    <p class="modal__text" id="modal-message">Você precisa estar logado para realizar essa ação</p>

    <div class="modal__actions">
      <button type="button" class="modal__btn modal__btn--primary" id="modal-confirm-btn">Entendi</button>
    </div>
  </div>
</div>
